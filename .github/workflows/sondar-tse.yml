# Diagnóstico: baixa arquivos públicos do TSE e guarda na branch "sondagem-tse",
# para conferir o formato dos dados. Não afeta o app publicado.
name: Sondar TSE

on:
  workflow_dispatch:
    inputs:
      caminhos:
        description: Caminhos sob resultados.tse.jus.br/oficial, separados por espaço
        required: true

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        env:
          CAMINHOS: ${{ inputs.caminhos }}
        run: |
          mkdir -p tse && cd tse
          for C in $CAMINHOS; do
            F=$(echo "$C" | tr '/' '_')
            code=$(curl -sS -o "$F" -w '%{http_code}' "https://resultados.tse.jus.br/oficial/$C" || echo 000)
            echo "$code $C" | tee -a status.txt
            [ "$code" = 200 ] || rm -f "$F"
          done
      - name: Guardar na branch sondagem-tse
        run: |
          cd tse
          git init -q -b sondagem-tse
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "Sondagem dos arquivos do TSE"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sondagem-tse
