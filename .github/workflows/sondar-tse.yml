# Diagnóstico: baixa arquivos públicos do TSE e guarda na branch "sondagem-tse",
# para conferir o formato dos dados. Não afeta o app publicado.
name: Sondar TSE

on:
  workflow_dispatch:
    inputs:
      caminhos:
        description: Caminhos sob resultados.tse.jus.br/oficial, separados por espaço
        required: true

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        env:
          CAMINHOS: ${{ inputs.caminhos }}
        run: |
          mkdir -p tse && cd tse
          for C in $CAMINHOS; do
            F=$(echo "$C" | tr '/' '_')
            code=$(curl -sS -o "$F" -w '%{http_code}' "https://resultados.tse.jus.br/oficial/$C" || echo 000)
            echo "$code $C" | tee -a status.txt
            [ "$code" = 200 ] || rm -f "$F"
          done
          # Páginas HTML: baixa também os scripts que elas carregam e extrai os modelos de endereço
          for F in *; do
            grep -qi '<script' "$F" 2>/dev/null || continue
            BASE=https://resultados.tse.jus.br/oficial/$(dirname "$(echo "$F" | tr '_' '/')")
            for S in $(grep -oE 'src="[^"]+\.js"' "$F" | sed -E 's/src="([^"]+)"/\1/'); do
              case "$S" in http*) U=$S;; /*) U=https://resultados.tse.jus.br$S;; *) U=$BASE/$S;; esac
              N=js_$(basename "$S")
              curl -sS -o "$N" "$U" && echo "200 $U" >> status.txt
              grep -oE '.{0,120}(json|dados-simplificados|fotos).{0,120}' "$N" >> modelos.txt || true
            done
          done
      - name: Guardar na branch sondagem-tse
        run: |
          cd tse
          git init -q -b sondagem-tse
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "Sondagem dos arquivos do TSE"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sondagem-tse
